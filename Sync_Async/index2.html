<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Callbacks and Promises</title>
  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f8f9fa;
      padding: 30px;
      text-align: center;
    }
    h2 {
      color: #333;
    }
    p {
      font-size: 18px;
      margin: 5px 0;
    }
    #output {
      margin-top: 20px;
      background: #fff;
      border-radius: 10px;
      padding: 20px;
      display: inline-block;
      text-align: left;
      box-shadow: 0 0 8px rgba(0,0,0,0.2);
      min-width: 300px;
    }
  </style>
</head>
<body>
  <h2>Callbacks, Promises, .then() and .catch()</h2>
  <div id="output"></div>

  <script>
    const output = document.getElementById("output");
    const print = (msg) => {
      const p = document.createElement("p");
      p.textContent = msg;
      output.appendChild(p);
    };

    function processUserInput(name, callback) {
      print("Processing user input...");
      callback(name);
    }

    function greetUser(name) {
      print("Hello, " + name + "!");
    }

    processUserInput("Hariharan", greetUser);

    function checkNumber(num) {
      return new Promise((resolve, reject) => {
        print("Checking number...");
        setTimeout(() => {
          if (num % 2 === 0) {
            resolve("✅ The number " + num + " is even!");
          } else {
            reject("❌ The number " + num + " is odd!");
          }
        }, 2000);
      });
    }

    checkNumber(80)
      .then((message) => {
        print("Promise Resolved:");
        print(message);
      })
      .catch((error) => {
        print("Promise Rejected:");
        print(error);
      });
  </script>
</body>
</html>
